name: ✨ Feature request
description: Suggest a brand new feature
title: "Name of the feature you would like to have added "
labels: ["✨ feature"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! The more concrete the use case, the easier it is to evaluate and implement.
        For improvements to something that already exists, use the **Enhancement** form. For bugs and crashes, use the **Bug report** form.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-submit checks
      options:
        - label: I searched existing issues (open and closed) and found no duplicate
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What are you trying to do, and what is getting in your way? Describe the use case, not the solution.
      placeholder: "I'm trying to ... but ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like it to work? Drawings, examples or screenshots are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you tried or thought about.

  - type: input
    id: mc_version
    attributes:
      label: Minecraft / NeoForge version
      description: The version you are using, in case the request depends on it.
      placeholder: "1.21.1 / NeoForge 21.1.xxx"

  - type: dropdown
    id: contribute
    attributes:
      label: Would you be willing to contribute?
      options:
        - "No"
        - Yes, I can open a pull request
        - Yes, I can help with testing
      default: 0

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Links, references to other mods, anything else that helps.