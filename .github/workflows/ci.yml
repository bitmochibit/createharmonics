# .github/workflows/ci.yml
#
# Runs on every push and pull-request targeting main.
# Steps:
#   1. Build the full mod (shadowJar)
#   2. Run data generation (runData) to verify it doesn't crash
#   3. Run unit tests if any exist
#
# The produced JAR is uploaded as a build artifact so you can download it
# from any run, useful for quick smoke-testing before deciding to release.

name: CI

on:
  push:
    branches: [1.21.1/master]
  pull_request:
    branches: [1.21.1/master]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      # ── Full build (compiles common + neoforge, produces shaded JAR) ────────
      - name: Build
        run: ./gradlew :neoforge:build --stacktrace

      # ── Data generation ──────────────────────────────────────────────────────
      # runData launches a headless Minecraft instance to generate data files.
      # It exits with a non-zero code on crash, which will fail the step.
      - name: Run data generation
        run: >
          ./gradlew :neoforge:runData
          --stacktrace
          -Porg.gradle.jvmargs="-Xmx2g"
        timeout-minutes: 10
        continue-on-error: false
        env:
          # Needed for NeoForge's headless data run
          CI: true

      # ── GameTests ───────────────────────────────────────────────────────────
      - name: Run game tests
        run: >
          ./gradlew :neoforge:runGameTestServer
          --stacktrace
          -Porg.gradle.jvmargs="-Xmx2g"
        timeout-minutes: 10
        env:
          CI: true

      # ── Unit tests ───────────────────────────────────────────────────────────
      # JUnit tests in :common or :neoforge are run here.
      # This step is intentionally lenient: if no tests exist Gradle exits 0.
      #
      # When you add NeoForge GameTests, register a `gameTestServer` run in
      # neoforge/build.gradle.kts and add a step like:
      #   ./gradlew :neoforge:runGameTestServer
      - name: Run unit tests
        run: ./gradlew test --stacktrace
        continue-on-error: false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
          retention-days: 14

      # ── Upload build artifacts ───────────────────────────────────────────────
      - name: Read mod version
        id: mod_version
        run: |
          MAJOR=$(grep '^version_major' gradle.properties | cut -d= -f2 | tr -d ' ')
          MINOR=$(grep '^version_minor' gradle.properties | cut -d= -f2 | tr -d ' ')
          PATCH=$(grep '^version_patch' gradle.properties | cut -d= -f2 | tr -d ' ')
          echo "version=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          # e.g. createharmonics-neoforge-1.21.1-1.1.6
          name: createharmonics-neoforge-1.21.1-${{ steps.mod_version.outputs.version }}
          path: neoforge/build/libs/createharmonics-neoforge-*.jar
          if-no-files-found: error
          retention-days: 30