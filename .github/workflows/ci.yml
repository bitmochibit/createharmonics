name: CI

on:
  push:
    branches: [1.21.1/master]
  pull_request:
    branches: [1.21.1/master]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew :neoforge:build --stacktrace

      - name: Run data generation
        run: >
          ./gradlew :neoforge:runData
          --stacktrace
          -Porg.gradle.jvmargs="-Xmx2g"
        timeout-minutes: 10
        continue-on-error: false
        env:
          CI: true

      - name: Run game tests
        run: >
          ./gradlew :neoforge:runGameTestServer
          --stacktrace
          -Porg.gradle.jvmargs="-Xmx2g"
        timeout-minutes: 10
        env:
          CI: true

      - name: Run unit tests
        run: ./gradlew test --stacktrace
        continue-on-error: false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
          retention-days: 14

      - name: Read mod version
        id: mod_version
        run: |
          MAJOR=$(grep '^version_major' gradle.properties | cut -d= -f2 | tr -d ' ')
          MINOR=$(grep '^version_minor' gradle.properties | cut -d= -f2 | tr -d ' ')
          PATCH=$(grep '^version_patch' gradle.properties | cut -d= -f2 | tr -d ' ')
          echo "version=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          # e.g. createharmonics-neoforge-1.21.1-1.1.6
          name: createharmonics-neoforge-1.21.1-${{ steps.mod_version.outputs.version }}
          path: neoforge/build/libs/createharmonics-neoforge-*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Prepare nightly jar
        id: nightly
        if: github.event_name == 'push'
        env:
          BASE_VERSION: ${{ steps.mod_version.outputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          VERSION="${BASE_VERSION}-nightly.${RUN_NUMBER}+${SHORT_SHA}"
          SRC=$(find neoforge/build/libs -name 'createharmonics-neoforge-*.jar' \
                  ! -name '*-sources.jar' ! -name '*-dev*.jar' | head -n1)
          DEST="createharmonics-neoforge-1.21.1-${VERSION}.jar"
          cp "$SRC" "$DEST"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "file=${DEST}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Publish nightly to Discord
        if: github.event_name == 'push'
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERSION: ${{ steps.nightly.outputs.version }}
          FILE: ${{ steps.nightly.outputs.file }}
          SHA: ${{ steps.nightly.outputs.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          MSG=$(git log -1 --pretty=%s)
          PAYLOAD=$(jq -n \
            --arg v "$VERSION" --arg sha "$SHA" --arg msg "$MSG" --arg url "$REPO_URL/commit/$(git rev-parse HEAD)" \
            '{embeds:[{title:("Nightly " + $v), description:$msg,
               url:$url, color:5763719,
               fields:[{name:"Commit", value:("[" + $sha + "](" + $url + ")"), inline:true}]}]}')
          curl -fsS \
            -F "payload_json=$PAYLOAD" \
            -F "file=@${FILE}" \
            "$WEBHOOK"