# .github/workflows/release.yml
#
# Triggered manually from the GitHub Actions UI ("Run workflow" button).
# Steps:
#   1. Build the Modrinth JAR  (no `curseforge` property → includes bin installer)
#   2. Build the CurseForge JAR (with `curseforge` property → excludes it)
#   3. Extract the changelog for the current version from CHANGELOG.md
#   4. Create a GitHub Release with both JARs attached
#   5. Publish to Modrinth
#   6. Publish to CurseForge

name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build & parse changelog but do NOT publish)"
        type: boolean
        default: false

permissions:
  contents: write  # needed to create the GitHub Release

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (target ref)
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      # ── Read version from gradle.properties ──────────────────────────────────
      - name: Read mod version
        id: version
        run: |
          MAJOR=$(grep '^version_major' gradle.properties | cut -d= -f2 | tr -d ' ')
          MINOR=$(grep '^version_minor' gradle.properties | cut -d= -f2 | tr -d ' ')
          PATCH=$(grep '^version_patch' gradle.properties | cut -d= -f2 | tr -d ' ')
          MC=$(grep '^minecraft_version' gradle.properties | cut -d= -f2 | tr -d ' ')
          MOD_ID=$(grep '^mod_id' gradle.properties | cut -d= -f2 | tr -d ' ')
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=${VERSION}"           >> "$GITHUB_OUTPUT"
          echo "mc_version=${MC}"             >> "$GITHUB_OUTPUT"
          echo "mod_id=${MOD_ID}"             >> "$GITHUB_OUTPUT"
          echo "tag=mc${MC}-v${VERSION}"      >> "$GITHUB_OUTPUT"
          echo "jar_base=${MOD_ID}-neoforge-${MC}" >> "$GITHUB_OUTPUT"

      # ── Extract changelog for this version ───────────────────────────────────
      - name: Extract changelog entry
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CHANGELOG_FILE="CHANGELOG.md"

          ENTRY=$(awk "
            /^# .*${VERSION}/ { found=1; next }
            found && /^# /    { exit }
            found             { print }
          " "${CHANGELOG_FILE}" | sed '/^[[:space:]]*$/d' | head -200)

          if [ -z "$ENTRY" ]; then
            echo "::warning::No changelog entry found for version ${VERSION}"
            ENTRY="See CHANGELOG.md for details."
          fi

          printf '%s' "$ENTRY" > /tmp/changelog_entry.md
          echo "Changelog entry:"
          cat /tmp/changelog_entry.md

      # ── Build Modrinth JAR ────────────────────────────────────────────────────
      - name: Build (Modrinth)
        run: ./gradlew :neoforge:build --stacktrace

      - name: Rename Modrinth JAR
        run: |
          BASE="${{ steps.version.outputs.jar_base }}"
          VERSION="${{ steps.version.outputs.version }}"
          mv "neoforge/build/libs/${BASE}.jar" \
             "neoforge/build/libs/${BASE}-${VERSION}.jar"

      # ── Build CurseForge JAR ──────────────────────────────────────────────────
      - name: Build (CurseForge)
        run: ./gradlew :neoforge:buildForCurseforge --stacktrace

      - name: Rename CurseForge JAR
        run: |
          BASE="${{ steps.version.outputs.jar_base }}"
          VERSION="${{ steps.version.outputs.version }}"
          cp "neoforge/build/libs/${BASE}.jar" \
             "neoforge/build/libs/${BASE}-${VERSION}-cf.jar"

      # ── GitHub Release ────────────────────────────────────────────────────────
      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Create: Harmonics ${{ steps.version.outputs.version }}"
          body_path: /tmp/changelog_entry.md
          draft: false
          prerelease: false
          files: |
            neoforge/build/libs/${{ steps.version.outputs.jar_base }}-${{ steps.version.outputs.version }}.jar
            neoforge/build/libs/${{ steps.version.outputs.jar_base }}-${{ steps.version.outputs.version }}-cf.jar

      # ── Publish to Modrinth ───────────────────────────────────────────────────
      - name: Publish to Modrinth
        if: ${{ !inputs.dry_run }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID || steps.version.outputs.mod_id }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true

          name: "Create: Harmonics ${{ steps.version.outputs.version }} for Minecraft ${{ steps.version.outputs.mc_version }}"
          version: ${{ steps.version.outputs.version }}
          version-type: release
          changelog-file: /tmp/changelog_entry.md

          files: neoforge/build/libs/${{ steps.version.outputs.jar_base }}-${{ steps.version.outputs.version }}.jar

          game-versions: ${{ steps.version.outputs.mc_version }}
          loaders: neoforge
          dependencies: |
            create | depends | *
            kotlin-for-forge | depends | *
            jei | optional | *

      # ── Publish to CurseForge ─────────────────────────────────────────────────
      - name: Publish to CurseForge
        if: ${{ !inputs.dry_run }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          name: "Create: Harmonics ${{ steps.version.outputs.version }} for Minecraft ${{ steps.version.outputs.mc_version }}"
          version: ${{ steps.version.outputs.version }}
          version-type: release
          changelog-file: /tmp/changelog_entry.md

          files: neoforge/build/libs/${{ steps.version.outputs.jar_base }}-${{ steps.version.outputs.version }}-cf.jar

          game-versions: ${{ steps.version.outputs.mc_version }}
          loaders: neoforge
          dependencies: |
            create | depends | *
            kotlin-for-forge | depends | *
            jei | optional | *

      # ── Summary ──────────────────────────────────────────────────────────────
      - name: Job summary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DRY="${{ inputs.dry_run }}"
          {
            echo "## Release $VERSION"
            if [ "$DRY" = "true" ]; then
              echo "> **Dry run** — nothing was published."
            else
              echo "✅ Published to GitHub Releases, Modrinth, and CurseForge."
            fi
            echo ""
            echo "### Changelog"
            cat /tmp/changelog_entry.md
          } >> "$GITHUB_STEP_SUMMARY"
